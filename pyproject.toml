[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script"
version = "0.1.0"
description = "Book catalogue scraper"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.45,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
script = "script.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
